[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lamina-physician-directory"
version = "0.1.0"
description = "NPPES physician directory and reserved agent profiles for Lamina"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=2.9,<3",
  "openai-agents>=0.19,<1",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "tqdm>=4.66,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
lamina-download-nppes = "lamina_directory.download_nppes:main"
lamina-download-taxonomy = "lamina_directory.download_taxonomy:main"
lamina-build-directory = "lamina_directory.build_directory:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
